<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calcBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#calcBg)"/>

  <!-- Arithmetic Grid: Plus, Minus, Multiply, Equal -->
  <!-- Plus (+) Top Left -->
  <path d="M 38 28 L 38 48 M 28 38 L 48 38" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Minus (-) Top Right -->
  <line x1="80" y1="38" x2="100" y2="38" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Multiply (x) Bottom Left -->
  <path d="M 31 83 L 45 97 M 45 83 L 31 97" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Equals (=) Bottom Right -->
  <line x1="80" y1="85" x2="100" y2="85" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="95" x2="100" y2="95" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Central dividing grid lines -->
  <line x1="64" y1="24" x2="64" y2="104" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="24" y1="64" x2="104" y2="64" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
</svg>
