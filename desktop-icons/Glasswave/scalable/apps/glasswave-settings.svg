<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gearBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e8e93"/>
      <stop offset="100%" stop-color="#48484a"/>
    </linearGradient>
    <linearGradient id="gearMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f2f7"/>
      <stop offset="50%" stop-color="#d1d1d6"/>
      <stop offset="100%" stop-color="#8e8e93"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#gearBg)"/>
  
  <!-- Outer Cog Wheel -->
  <g transform="translate(64,64)">
    <circle r="36" fill="url(#gearMetal)"/>
    <!-- 8 Cog Teeth -->
    <path d="M -6 -42 L 6 -42 L 4 -32 L -4 -32 Z" fill="url(#gearMetal)"/>
    <path d="M -6 -42 L 6 -42 L 4 -32 L -4 -32 Z" fill="url(#gearMetal)" transform="rotate(45)"/>
    <path d="M -6 -42 L 6 -42 L 4 -32 L -4 -32 Z" fill="url(#gearMetal)" transform="rotate(90)"/>
    <path d="M -6 -42 L 6 -42 L 4 -32 L -4 -32 Z" fill="url(#gearMetal)" transform="rotate(135)"/>
    <path d="M -6 -42 L 6 -42 L 4 -32 L -4 -32 Z" fill="url(#gearMetal)" transform="rotate(180)"/>
    <path d="M -6 -42 L 6 -42 L 4 -32 L -4 -32 Z" fill="url(#gearMetal)" transform="rotate(225)"/>
    <path d="M -6 -42 L 6 -42 L 4 -32 L -4 -32 Z" fill="url(#gearMetal)" transform="rotate(270)"/>
    <path d="M -6 -42 L 6 -42 L 4 -32 L -4 -32 Z" fill="url(#gearMetal)" transform="rotate(315)"/>
    <!-- Center Hole -->
    <circle r="14" fill="#3a3a3c"/>
  </g>
</svg>
